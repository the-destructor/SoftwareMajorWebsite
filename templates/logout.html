{% extends 'layout.html' %}
{% block content %}
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="static/css/style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body style="background-color: #101023; color: white;">
    <div class="container d-flex justify-content-center align-items-center vh-50">
        
        <form action="/logout" method="POST" class="box">
          <h1 style="margin:2%">Are you sure you want to Log Out?!?!!</h1>
        
          <button type="submit"  style="margin-top:10%" class="btn btn-primary">Log-Out</button>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          </form>
          </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
{% endblock %}
