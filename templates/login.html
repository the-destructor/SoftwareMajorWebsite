{% extends 'layout.html' %}
{% block content %}
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="static/css/style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body style="background-color: #101023; color: white;">
    <div class="container d-flex justify-content-center align-items-center vh-50">
        
            <form action="/login" method="POST" class="box">
                <h1 style="margin:2%">Log-in</h1>
         <div class="form-group" style="margin-top:2%">
            <label for="InputUsername">Username</label>
            <input type="text" name="username" class="form-control" id="InputUsername" aria-describedby="emailHelp" placeholder="Enter username">
        </div>
        <div class="form-group" style="margin-top:2%">
            <label for="InputPassword">Password</label>
            <input type="password" name="password" class="form-control" id="InputPassword" placeholder="Password">
            <small id="emailHelp" class="form-text" style="color:rgb(224, 224, 224)">Needs at least 8 Characters, Capital, Lowercase, Special Character and Number</small>
        </div>
        <button type="submit"  style="margin-top:10%" class="neon-button">Submit</button>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        </form>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
{% endblock %}
